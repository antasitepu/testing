[workspace]
members = [
  "apps/server",
  "crates/analysis-core",
  "crates/analysis-domain",
  "crates/analysis-plans",
  "crates/analysis-service",
  "crates/analysis-storage",
  "crates/backtest-engine",
  "crates/binance-adapter",
  "crates/execution-domain",
  "crates/execution-service",
  "crates/execution-storage",
  "crates/market-domain",
  "crates/market-service",
  "crates/market-storage",
  "crates/runtime-observability",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
rust-version = "1.94.1"

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
futures-util = "0.3.32"
http-body-util = "0.1.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
runtime-observability = { path = "crates/runtime-observability" }
rust_decimal = { version = "1.42.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "rust_decimal", "json", "uuid"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "test-util"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "url"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.23.3", features = ["serde", "v7"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
