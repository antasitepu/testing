name: test

# The Rust part of `make verify-fast` on the public snapshot: format, clippy and the
# whole workspace test suite against an isolated PostgreSQL. Web, scripts and
# code-graph tests are not in the public snapshot and run locally.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gold
          POSTGRES_PASSWORD: gold
          POSTGRES_DB: gold-monitoring-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gold"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CARGO_TERM_COLOR: never
      TEST_DATABASE_URL: postgres://gold:gold@localhost:5432/gold-monitoring-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal -c clippy -c rustfmt
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -A clippy::large-enum-variant -D warnings

      - name: Tests
        run: cargo test --workspace --locked -- --test-threads=1
